[project]
name = "tf-idf"
version = "0.1.0"
description = "Implementation of Term Frequency - Inverse Document Frequency Algorithm"
authors = [
    {name = "Your Name",email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ruff (>=0.14.8,<0.15.0)",
    "pytest (>=9.0.2,<10.0.0)"

]

[tool.poetry]
packages = [{ include = "tfidf" }]

[tool.ruff]
line-length = 100


[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]


[tool.ruff.format]
quote-style = "double"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
